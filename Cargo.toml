[package]
name = "rooting-forms"
version = "0.0.3"
edition = "2021"
license = "ISC"
description = "Generates HTML (rooting) forms from structures"
homepage = "https://github.com/andrewbaxter/rooting-forms"
repository = "https://github.com/andrewbaxter/rooting-forms"
readme = "readme.md"

[workspace]
members = ["proc_macros"]

[features]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true }
rooting = "0.1"
rooting_forms_proc_macros = { version = "0.0.3", path = "proc_macros" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "HtmlSelectElement",
    "HtmlInputElement",
] }
